<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Select widgets</title>
	<link rel='stylesheet' href="./css/index.css">
</head>
<body onload="initSelect()">
    <h1 class="header">Widget Select</h1>

    <div class="menu">
        <div class="widgetSelect">
            <div>
                    <div class="widgetHeader">Clock</div>
                    <div class="widgetText">Display time</div>
            </div>
            <input type="checkbox" class="widgetCheckbox" data-widget="clock0">
        </div>
        <div class="widgetSelect">
            <div>
                    <div class="widgetHeader">Weather</div>
                    <div class="widgetText">Displays weather</div>
            </div>
            <input type="checkbox" class="widgetCheckbox" data-widget="weather0">
        </div>
        <div class="widgetSelect">
            <div>
                    <div class="widgetHeader">Calendar</div>
                    <div class="widgetText">Shows todays schedule</div>
            </div>
            <input type="checkbox" class="widgetCheckbox" data-widget="calender0">
        </div>
        <div class="widgetSelect">
            <div>
                    <div class="widgetHeader">Bus</div>
                    <div class="widgetText">Countdown to the time your bus leaves</div>
            </div>
            <input type="checkbox" class="widgetCheckbox" data-widget="bus0">
        </div>
    </div>

    <button id="finishedButton" onclick="window.location.href='index.html';">Finished</button>

<script src="main.js"></script>
</body>
</html>
