<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MirrorConnect</title>
	<link rel='stylesheet' href="./css/index.css">
</head>
<body onload="initAll()">

    <div id="clock0" class="clock widget hidden0" onmousedown="nodeGrab(0, event)" onmouseup="nodeDrop(0)">
        <div id="clock1"></div>
        <div id="clock2"></div>
    </div>


    <div id="weather0" class="weather widget hidden0" onmousedown="nodeGrab(1, event)" onmouseup="nodeDrop(1)">

        <div id="weather-card">
          <div class="weather-header">
            <div>
              <div class="w-city" id="w-city">Loading...</div>
              <div class="w-condition" id="w-condition">--</div>
            </div>
            <div class="w-icon" id="w-icon">☀️</div>
          </div>

          <div class="w-temp" id="w-temp">--°C</div>

          <div class="w-forecast" id="w-forecast"></div>
        </div>

    </div>


    <div id="calender0" class="calender widget hidden0" onmousedown="nodeGrab(2, event)" onmouseup="nodeDrop(2)">
        <div class="calendar-wrapper-box">
            <div class="calendar-header">
                <h3>Upcoming Events</h3>
                <button id="signout_button" onclick="handleSignoutClick()" style="display: none;">Sign Out</button>
            </div>
            <div id="content">Loading calendars...</div>
        </div>
    </div>

    <div id="bus0" class="bus widget hidden0" onmousedown="nodeGrab(3,event)" onmouseup="nodeDrop(3)">
        <div id="bus1"></div>
    </div>

    <div id="tamagotchi0" class="tamagotchi widget hidden0" onmousedown="nodeGrab(4, event)" onmouseup="nodeDrop(4)">
        <div class="tamagotchi-inner">
            <span>test</span>
            <img id="gif0" src="./images/sheen.gif" alt="Tamagotchi" style="width:48px;height:48px;">
        </div>
    </div>

    <button id="clear" class="hidden" onclick="clearScreen()"><img src="./SVG/clear1.svg" height="30" width="30"></button>
    <button id="add" class="hidden" onclick="window.location.href='select.html';"><img src="./SVG/add1.svg" height="30" width="30"></button>


<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
